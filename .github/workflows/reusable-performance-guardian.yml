name: Reusable Performance Guardian

on:
  workflow_call:
    inputs:
      project-path:
        description: Repository-relative directory containing project.godot.
        required: true
        type: string
      profile:
        description: PerformanceBudgetProbe profile to capture.
        required: true
        type: string
      budget-file:
        description: Repository-relative v2 or v3 performance budget JSON file.
        required: true
        type: string
      scene-path:
        description: Optional res:// scene; defaults to the project's main scene.
        required: false
        default: ""
        type: string
      godot-version:
        description: Godot version installed for capture.
        required: false
        default: "4.5.1"
        type: string
      use-dotnet:
        description: Install the .NET Godot build.
        required: false
        default: false
        type: boolean
      warmup-frames:
        description: Frames completed before measurement.
        required: false
        default: 120
        type: number
      measured-frames:
        description: Frames included in each capture.
        required: false
        default: 600
        type: number
      sampling-interval:
        description: Measured frames between samples.
        required: false
        default: 1
        type: number
      capture-runs:
        description: Number of isolated capture processes.
        required: false
        default: 3
        type: number
      compare-with-base:
        description: Compare a pull-request candidate with its protected base revision using schema v3.
        required: false
        default: false
        type: boolean
      investigate:
        description: "Optional AI mode: never, on-failure, or always."
        required: false
        default: never
        type: string
      openai-model:
        description: Optional investigator model override.
        required: false
        default: gpt-4.1-mini
        type: string
    secrets:
      openai-api-key:
        description: Optional API key used only when investigation is requested.
        required: false

permissions:
  contents: read

jobs:
  performance-guardian:
    runs-on: windows-latest
    env:
      GUARDIAN_TOOLS: ${{ github.workspace }}\.performance-guardian-tooling
      RUN_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs['compare-with-base'] && github.event.pull_request.head.sha || github.sha }}

      - name: Check out protected base revision
        if: inputs.compare-with-base
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .performance-guardian-base-source

      - name: Check out matching Guardian tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .performance-guardian-tooling

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789 # v2.4.1
        with:
          version: ${{ inputs['godot-version'] }}
          use-dotnet: ${{ inputs['use-dotnet'] }}
          include-templates: false

      - name: Validate investigation mode
        shell: pwsh
        env:
          INVESTIGATE: ${{ inputs.investigate }}
        run: |
          if ($env:INVESTIGATE -notin @("never", "on-failure", "always")) {
            Write-Error "investigate must be never, on-failure, or always"
            exit 2
          }
          if ('${{ inputs.compare-with-base }}' -eq 'true' -and '${{ github.event_name }}' -ne 'pull_request') {
            Write-Error "compare-with-base requires a pull_request event"
            exit 2
          }

      - name: Install optional investigator dependencies
        if: inputs.investigate != 'never'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r "$env:GUARDIAN_TOOLS\requirements-agent.txt"
          python -m pip check

      - name: Capture protected baseline runs
        id: baseline-capture
        if: inputs.compare-with-base
        continue-on-error: true
        shell: pwsh
        env:
          PROJECT_PATH: .performance-guardian-base-source/${{ inputs['project-path'] }}
          PROFILE: ${{ inputs.profile }}
          SCENE_PATH: ${{ inputs['scene-path'] }}
          WARMUP_FRAMES: ${{ inputs['warmup-frames'] }}
          MEASURED_FRAMES: ${{ inputs['measured-frames'] }}
          SAMPLING_INTERVAL: ${{ inputs['sampling-interval'] }}
          CAPTURE_RUNS: ${{ inputs['capture-runs'] }}
          SOURCE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GODOT) -or -not (Test-Path -LiteralPath $env:GODOT -PathType Leaf)) {
            Write-Error "The setup-godot action did not provide a valid GODOT executable."
            exit 2
          }
          $arguments = @(
            "$env:GUARDIAN_TOOLS\tools\capture_project.py",
            "--workspace-root", "$env:GITHUB_WORKSPACE",
            "--godot-executable", "$env:GODOT",
            "--project-path", "$env:PROJECT_PATH",
            "--profile", "$env:PROFILE",
            "--output-base", ".performance-guardian",
            "--run-prefix", "$env:RUN_PREFIX-base",
            "--runs", "$env:CAPTURE_RUNS",
            "--warmup-frames", "$env:WARMUP_FRAMES",
            "--measured-frames", "$env:MEASURED_FRAMES",
            "--sampling-interval", "$env:SAMPLING_INTERVAL",
            "--source-revision", "$env:SOURCE_REVISION"
          )
          if ($env:SCENE_PATH) { $arguments += @("--scene-path", "$env:SCENE_PATH") }
          $manifest = python @arguments
          $captureExit = $LASTEXITCODE
          $manifest | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\baseline-capture-manifest.json"
          exit $captureExit

      - name: Capture candidate runs
        id: capture
        continue-on-error: true
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs['project-path'] }}
          PROFILE: ${{ inputs.profile }}
          SCENE_PATH: ${{ inputs['scene-path'] }}
          WARMUP_FRAMES: ${{ inputs['warmup-frames'] }}
          MEASURED_FRAMES: ${{ inputs['measured-frames'] }}
          SAMPLING_INTERVAL: ${{ inputs['sampling-interval'] }}
          CAPTURE_RUNS: ${{ inputs['capture-runs'] }}
          SOURCE_REVISION: ${{ inputs['compare-with-base'] && github.event.pull_request.head.sha || github.sha }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GODOT) -or -not (Test-Path -LiteralPath $env:GODOT -PathType Leaf)) {
            Write-Error "The setup-godot action did not provide a valid GODOT executable."
            exit 2
          }
          $arguments = @(
            "$env:GUARDIAN_TOOLS\tools\capture_project.py",
            "--workspace-root", "$env:GITHUB_WORKSPACE",
            "--godot-executable", "$env:GODOT",
            "--project-path", "$env:PROJECT_PATH",
            "--profile", "$env:PROFILE",
            "--output-base", ".performance-guardian",
            "--run-prefix", "$env:RUN_PREFIX-candidate",
            "--runs", "$env:CAPTURE_RUNS",
            "--warmup-frames", "$env:WARMUP_FRAMES",
            "--measured-frames", "$env:MEASURED_FRAMES",
            "--sampling-interval", "$env:SAMPLING_INTERVAL",
            "--source-revision", "$env:SOURCE_REVISION"
          )
          if ($env:SCENE_PATH) { $arguments += @("--scene-path", "$env:SCENE_PATH") }
          $manifest = python @arguments
          $captureExit = $LASTEXITCODE
          $manifest | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\candidate-capture-manifest.json"
          exit $captureExit

      - name: Run authoritative performance gate
        if: always() && steps.capture.outcome != 'skipped'
        shell: pwsh
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          BASELINE_CAPTURE_OUTCOME: ${{ steps.baseline-capture.outcome }}
          PROJECT_PATH: ${{ inputs['project-path'] }}
          PROFILE: ${{ inputs.profile }}
          BUDGET_FILE: ${{ inputs['budget-file'] }}
          INVESTIGATE: ${{ inputs.investigate }}
          OPENAI_API_KEY: ${{ secrets['openai-api-key'] }}
          OPENAI_MODEL: ${{ inputs['openai-model'] }}
          COMPARE_WITH_BASE: ${{ inputs['compare-with-base'] }}
        run: |
          $results = "$env:PROJECT_PATH/.performance-guardian/$env:PROFILE/$env:RUN_PREFIX-candidate/captures"
          if ($env:CAPTURE_OUTCOME -ne "success") {
            $results = "$env:PROJECT_PATH/.performance-guardian/$env:PROFILE/$env:RUN_PREFIX-candidate/incomplete-capture"
          }
          $budget = "$env:BUDGET_FILE"
          $baselineArguments = @()
          if ($env:COMPARE_WITH_BASE -eq "true") {
            $baseline = ".performance-guardian-base-source/$env:PROJECT_PATH/.performance-guardian/$env:PROFILE/$env:RUN_PREFIX-base/captures"
            if ($env:BASELINE_CAPTURE_OUTCOME -ne "success") {
              $baseline = ".performance-guardian-base-source/$env:PROJECT_PATH/.performance-guardian/$env:PROFILE/$env:RUN_PREFIX-base/incomplete-capture"
            }
            $budget = ".performance-guardian-base-source/$env:BUDGET_FILE"
            $baselineArguments = @("--baseline-results", "$baseline")
          }
          $arguments = @(
            "$env:GUARDIAN_TOOLS\tools\run_guardian.py",
            "--workspace-root", "$env:GITHUB_WORKSPACE",
            "--json",
            "--investigate", "$env:INVESTIGATE"
          ) + $baselineArguments + @("$results", "$budget")
          $report = python @arguments
          $gateExit = $LASTEXITCODE
          $reportPath = "$env:RUNNER_TEMP\guardian-report.json"
          $artifactName = "performance-guardian-$env:PROFILE-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $report | Set-Content -Encoding utf8 $reportPath
          python "$env:GUARDIAN_TOOLS\tools\render_action_report.py" `
            --summary-file "$env:GITHUB_STEP_SUMMARY" `
            --artifact-name $artifactName `
            $reportPath
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Performance Guardian presentation failed safely; the deterministic exit is unchanged."
          }
          exit $gateExit

      - name: Stage performance evidence
        if: always()
        shell: pwsh
        env:
          PROJECT_PATH: ${{ inputs['project-path'] }}
          COMPARE_WITH_BASE: ${{ inputs['compare-with-base'] }}
        run: |
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspacePrefix = $workspace.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
          $projectRoot = [System.IO.Path]::GetFullPath((Join-Path $workspace $env:PROJECT_PATH))
          if ($projectRoot -ne $workspace -and -not $projectRoot.StartsWith($workspacePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
            Write-Error "The project path escaped the consumer workspace while staging evidence."
            exit 2
          }

          $artifactRoot = Join-Path $env:RUNNER_TEMP "performance-guardian-artifact"
          if (Test-Path -LiteralPath $artifactRoot) {
            Write-Error "The performance evidence staging directory already exists."
            exit 2
          }
          New-Item -ItemType Directory -Path $artifactRoot | Out-Null

          $candidateEvidence = Join-Path $projectRoot ".performance-guardian"
          if (Test-Path -LiteralPath $candidateEvidence -PathType Container) {
            Copy-Item -LiteralPath $candidateEvidence -Destination (Join-Path $artifactRoot "candidate") -Recurse
          }

          if ($env:COMPARE_WITH_BASE -eq "true") {
            $baseSourceRoot = [System.IO.Path]::GetFullPath((Join-Path $workspace ".performance-guardian-base-source"))
            $basePrefix = $baseSourceRoot.TrimEnd([System.IO.Path]::DirectorySeparatorChar) + [System.IO.Path]::DirectorySeparatorChar
            $baseProjectRoot = [System.IO.Path]::GetFullPath((Join-Path $baseSourceRoot $env:PROJECT_PATH))
            if ($baseProjectRoot -ne $baseSourceRoot -and -not $baseProjectRoot.StartsWith($basePrefix, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Error "The project path escaped the protected-base checkout while staging evidence."
              exit 2
            }
            $baselineEvidence = Join-Path $baseProjectRoot ".performance-guardian"
            if (Test-Path -LiteralPath $baselineEvidence -PathType Container) {
              Copy-Item -LiteralPath $baselineEvidence -Destination (Join-Path $artifactRoot "baseline") -Recurse
            }
          }

          $reportsRoot = Join-Path $artifactRoot "reports"
          foreach ($reportName in @("baseline-capture-manifest.json", "candidate-capture-manifest.json", "guardian-report.json")) {
            $reportPath = Join-Path $env:RUNNER_TEMP $reportName
            if (Test-Path -LiteralPath $reportPath -PathType Leaf) {
              New-Item -ItemType Directory -Path $reportsRoot -Force | Out-Null
              Copy-Item -LiteralPath $reportPath -Destination (Join-Path $reportsRoot $reportName)
            }
          }

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-guardian-${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ runner.temp }}/performance-guardian-artifact
          if-no-files-found: warn
          retention-days: 14
